<header class="itau-header">
  <div class="header-left">
    <button class="menu-toggle" (click)="sidenav.toggle()" aria-label="Menu">
      <mat-icon>menu</mat-icon>
    </button>
    <img src="Itaú_Unibanco_logo_2023.svg.png" alt="Itaú" class="itau-logo-img" />
    <span class="header-title">Painel Autorizador Débito</span>
  </div>
  <div class="header-right">
    <button class="menu-toggle theme-toggle"
            (click)="themeService.toggle()"
            [title]="themeService.isDark() ? 'Modo claro' : 'Modo escuro'"
            [attr.aria-label]="themeService.isDark() ? 'Ativar modo claro' : 'Ativar modo escuro'">
      <mat-icon>{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
  </div>
</header>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="side" opened class="sidenav">
    <mat-nav-list>
      <a mat-list-item routerLink="/simulador" routerLinkActive="active-link">
        <mat-icon matListItemIcon>payment</mat-icon>
        <span matListItemTitle>Simulador Bandeiras</span>
      </a>
      <a mat-list-item routerLink="/dispatcher" routerLinkActive="active-link">
        <mat-icon matListItemIcon>hub</mat-icon>
        <span matListItemTitle>Dispatcher Bandeiras</span>
      </a>
      <a mat-list-item routerLink="/transacoes" routerLinkActive="active-link">
        <mat-icon matListItemIcon>receipt_long</mat-icon>
        <span matListItemTitle>Consulta transações</span>
      </a>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard Débito</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
