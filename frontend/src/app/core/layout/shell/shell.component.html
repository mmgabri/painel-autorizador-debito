<header class="itau-header">
  <div class="header-left">
    <button class="menu-toggle" (click)="sidenav.toggle()" aria-label="Menu">
      <mat-icon>menu</mat-icon>
    </button>
    <div class="itau-logo">
      <span class="itau-logo-text">itaú</span>
    </div>
    <span class="header-title">Painel Autorizador Débito</span>
  </div>
  <div class="header-right">
    <span class="header-user-info">ag: 0001 c/c: 00000-0</span>
  </div>
</header>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="side" opened class="sidenav">
    <mat-nav-list>
      <a mat-list-item routerLink="/simulador" routerLinkActive="active-link">
        <mat-icon matListItemIcon>payment</mat-icon>
        <span matListItemTitle>Simulador Autorizador Débito</span>
      </a>
      <a mat-list-item routerLink="/transacoes" routerLinkActive="active-link">
        <mat-icon matListItemIcon>receipt_long</mat-icon>
        <span matListItemTitle>Consulta transações</span>
      </a>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard Débito</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
