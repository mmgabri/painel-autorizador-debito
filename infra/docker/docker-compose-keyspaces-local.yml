services:
  cassandra:
    image: cassandra:4.1
    container_name: cassandra-keyspaces-local
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: local-keyspaces
      CASSANDRA_DC: us-east-1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
      - cassandra_data:/var/lib/cassandra

  cassandra-init:
    image: cassandra:4.1
    container_name: cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./init.cql:/init.cql:ro
    command: cqlsh cassandra -f /init.cql
    restart: on-failure

volumes:
  cassandra_data:
